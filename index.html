<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Munafa Capital</title>
<meta name="description" content="Munafa Capital — website launching soon.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%230a0a0b%22/><text x=%2250%22 y=%2268%22 font-size=%2258%22 text-anchor=%22middle%22 fill=%22%2314e08a%22 font-family=%22Arial%22>M</text></svg>">
<style>
  :root {
    --bg: #0a0a0b;
    --bg-2: #131315;
    --line: #232326;
    --accent: #14e08a;
    --accent-dim: #0e9c61;
    --text: #f2f2f0;
    --text-dim: #85857f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    position: relative;
    overflow: hidden;
  }
  .glow {
    position: absolute;
    width: 900px;
    height: 900px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(20,224,138,0.10) 0%, rgba(20,224,138,0) 65%);
    pointer-events: none;
  }
  .bg-lines {
    position: absolute;
    inset: 0;
    background-image: linear-gradient(var(--line) 1px, transparent 1px);
    background-size: 100% 88px;
    mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
    opacity: 0.5;
    pointer-events: none;
  }
  .container {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 2rem;
    max-width: 600px;
  }
  .mark {
    width: 56px;
    height: 56px;
    margin: 0 auto 2.25rem;
    border-radius: 14px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.02em;
  }
  h1 {
    font-size: clamp(2rem, 5.5vw, 3rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.15;
    color: var(--text);
    margin-bottom: 0.75rem;
  }
  .tagline {
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 2.75rem;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.4rem 0.9rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg-2);
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-bottom: 2.25rem;
  }
  .badge .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px 1px rgba(20,224,138,0.7);
  }
  .status-sub {
    font-size: 1rem;
    color: var(--text-dim);
    line-height: 1.65;
    max-width: 420px;
    margin: 0 auto 2.5rem;
  }
  .contact {
    font-size: 0.9rem;
  }
  .contact a {
    color: var(--text);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    padding-bottom: 3px;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .contact a:hover {
    color: var(--accent);
    border-color: var(--accent-dim);
  }
  footer {
    position: absolute;
    bottom: 1.75rem;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.72rem;
    color: var(--text-dim);
    letter-spacing: 0.04em;
    opacity: 0.55;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="bg-lines"></div>
  <div class="container">
    <div class="mark">M</div>
    <div class="badge"><span class="dot"></span> Launching soon</div>
    <h1>Munafa Capital</h1>
    <div class="tagline">Capital, Managed with Purpose</div>
    <p class="status-sub">We're building our new site. Check back soon to learn more about who we are and what we do.</p>
    <p class="contact">Get in touch — <a href="mailto:info@munafacapital.com">info@munafacapital.com</a></p>
  </div>
  <footer>&copy; <span id="year"></span> Munafa Capital. All rights reserved.</footer>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
